confirmed_need_id: NEED-DPSS-REDESIGN-001
need_name: "Автономный редизайн клиентских путей и процессов"
business_meaning: >-
  Система самостоятельно проводит редизайн клиентского пути от выбора процесса
  до утверждённых инициатив, включая расчёт финансового эффекта и списание
  бюджета на утверждённые мероприятия.

  Аналитик подключается только для приёмки результата.
client: "Аналитик ДПСС, спонсор редизайна, финансовый контролёр"

business_owner: "ТЕСТОВЫЙ ВЛАДЕЛЕЦ — файл создан для проверки поведения PKO"

journey_purpose: "Автономное проведение редизайна с расчётом и фиксацией финансового эффекта"
initial_state: "Процесс выбран для улучшения, ответственный не назначен"
target_state: >-
  Инициативы утверждены и переданы в исполнение, финансовый эффект рассчитан и
  зафиксирован в системах учёта, роли участников назначены автоматически.
success_criteria: >-
  Система автоматически проверяет согласованность артефактов между всеми шагами и
  блокирует противоречивый Executive Summary; результат выгружается в PowerPoint
  для спонсора; доступ к проектам разграничен ролевой моделью.

# --- входы профилирования: намеренно завышены -----------------------------
requested_mode: AUTO
