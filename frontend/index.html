<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PKO progress</title>
<style>
:root {
  --bg: #f8f9fb; --surface: #ffffff; --border: #e2e5ea;
  --text: #1e2229; --text-secondary: #5e6879;
  --accent: #2563eb; --accent-light: #eff4ff;
  --red: #dc2626; --red-light: #fef2f2;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.5; padding: 2rem 1rem;
}
.container { max-width: 900px; margin: 0 auto; }
h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; }
.subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem; }
form {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;
}
label { font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 0.35rem; }
.hint { font-size: 0.78rem; color: var(--text-secondary); margin-top: 0.3rem; }
input[type="text"], input[type="file"] {
  width: 100%; padding: 0.55rem 0.7rem; border: 1px solid var(--border); border-radius: 8px;
  font-size: 0.9rem; font-family: inherit;
}
.row { display: flex; gap: 1rem; flex-wrap: wrap; }
.row > div { flex: 1; min-width: 220px; }
button {
  align-self: flex-start; background: var(--accent); color: #fff; border: none;
  padding: 0.6rem 1.4rem; border-radius: 8px; font-size: 0.9rem; font-weight: 600;
  cursor: pointer;
}
button:disabled { opacity: 0.6; cursor: default; }
button:hover:not(:disabled) { filter: brightness(1.08); }
.status { margin-top: 1rem; font-size: 0.88rem; }
.status.loading { color: var(--text-secondary); }
.status.error {
  color: var(--red); background: var(--red-light); padding: 0.75rem 1rem;
  border-radius: 8px; white-space: pre-wrap;
}
#result-frame {
  width: 100%; height: 75vh; margin-top: 1.5rem; border: 1px solid var(--border);
  border-radius: 12px; display: none; background: var(--surface);
}
</style>
</head>
<body>
<div class="container">
  <h1>PKO progress</h1>
  <div class="subtitle">Сравнение PPTX-плана команды с кодом репозитория</div>

  <form id="progress-form">
    <div>
      <label for="plan">План (.pptx)</label>
      <input type="file" id="plan" name="plan" accept=".pptx" required />
    </div>
    <div class="row">
      <div>
        <label for="repo">Репозиторий</label>
        <input type="text" id="repo" name="repo" required
               placeholder="ssh://git@host:7999/project/repo.git или /путь/на/диске" />
        <div class="hint">SSH-ссылка (клонируется зеркалом) или локальный путь к клону</div>
      </div>
      <div>
        <label for="branch">Ветка</label>
        <input type="text" id="branch" name="branch" placeholder="master / main" />
        <div class="hint">необязательно, по умолчанию ветка по умолчанию</div>
      </div>
    </div>
    <button type="submit" id="submit-btn">Сравнить с планом</button>
  </form>

  <div id="status" class="status" style="display:none"></div>
  <iframe id="result-frame" sandbox=""></iframe>
</div>

<script>
const form = document.getElementById("progress-form");
const statusEl = document.getElementById("status");
const frame = document.getElementById("result-frame");
const submitBtn = document.getElementById("submit-btn");

function setStatus(text, cls) {
  statusEl.style.display = text ? "block" : "none";
  statusEl.className = "status" + (cls ? " " + cls : "");
  statusEl.textContent = text || "";
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  frame.style.display = "none";
  submitBtn.disabled = true;
  setStatus("Анализ идёт — читаю план, клонирую репозиторий, сравниваю с кодом…", "loading");

  try {
    const body = new FormData(form);
    const resp = await fetch("/api/progress", { method: "POST", body });
    const data = await resp.json();

    if (!resp.ok) {
      const detail = data.hint ? `${data.message}\n\n${data.hint}` : (data.message || "Неизвестная ошибка");
      setStatus(detail, "error");
      return;
    }

    setStatus("");
    frame.srcdoc = data.html;
    frame.style.display = "block";
  } catch (err) {
    setStatus("Не удалось выполнить запрос: " + err, "error");
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
