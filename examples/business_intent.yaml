# business_intent.yaml — единственный ручной вход PKO.
#
# Стандарт (§4.0) запрещает выводить эти поля из кода: потребность, целевое
# состояние, границы автономности и владельца результата подтверждает человек.
# Файл кладётся в корень анализируемого репозитория и коммитится вместе с кодом,
# чтобы подтверждение было привязано к версии, а не к «текущему состоянию».
#
# Без этого файла PKO выпускает черновик отчёта с пометками «не подтверждено»:
# карточка получает статус NO_DECISION, команда — код возврата 4. Это отсутствие
# решения, а не отказ в допуске (DENY, код 3).

# --- потребность и путь ----------------------------------------------------
confirmed_need_id: NEED-HR-001
need_name: Аналитика корпоративных данных по запросу на естественном языке
business_meaning: Сотрудник получает аналитический ответ по данным без посредников
client: HR-аналитик, HR BP, руководитель подразделения

journey_purpose: Ответ на аналитический вопрос по корпоративным данным
initial_state: У пользователя есть вопрос и нет ответа
target_state: Пользователь получил проверяемый аналитический ответ
success_criteria: Ответ содержит числа из базы и перечень использованных таблиц

# --- ответственность -------------------------------------------------------
# Это владелец объекта, отвечающий за клиентский результат.
# CODEOWNERS подтверждает только техвладельца и сюда не подставляется.
business_owner: Иванова А.А., владелец продукта аналитики

# --- входы профилирования (§0.2.1) ----------------------------------------
# Перечни закрытые. Неизвестное значение не заменяется мягким вариантом по
# умолчанию: файл считается непригодным, и решение Gate не выносится (NO_DECISION,
# код 4). Опечатка вида `hgh` не может понизить значимость последствий до низкой.
requested_mode: CONFIRM        # HUMAN_ONLY | ASSIST | CONFIRM | AUTO
maturity: pilot                # idea | pilot | limited | production | auto
consequence: low               # low | medium | high
scale: local                   # local | limited | mass
external_effects: none         # none либо перечень: financial, legal, client_data, …
decision_boundary: END_TO_END_PROCESS   # или COMPONENT_BBB

# --- граница решения -------------------------------------------------------
in_scope: Чтение данных, поиск схем, синтез ответа
out_of_scope: Изменение данных, внешние коммуникации, автоматические действия
