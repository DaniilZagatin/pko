    /* True single-element puzzle pieces using CSS masks.
     Each piece owns its left socket and right tab in one mask; no pseudo-elements, no SVG clip-path. */
  .stage-card {
    --tab-x: 17px;
    --tab-y: 21px;
    --piece-w: clamp(184px, 15.5vw, 206px);
    --piece-gap: 4px;
    --left-socket:
      radial-gradient(ellipse var(--tab-x) var(--tab-y) at 0 50%,
        #0000 calc(100% - 1px), #000 100%)
      0 0 / calc(100% - var(--tab-x)) 100% no-repeat;
    --right-tab:
      radial-gradient(ellipse var(--tab-x) var(--tab-y) at calc(100% - var(--tab-x)) 50%,
        #000 calc(100% - 1px), #0000 100%)
      0 0 / 100% 100% no-repeat;

    width:calc(var(--piece-w) + var(--tab-x));
    height:88px; min-height:88px; text-align:left; color:inherit;
    box-sizing:border-box;
    /* Border cannot follow a CSS mask. The visible contour is drawn by directional drop-shadows below. */
    border:0; border-radius:0;
    -webkit-mask:var(--left-socket), var(--right-tab);
            mask:var(--left-socket), var(--right-tab);
    -webkit-mask-composite:source-over;
            mask-composite:add;
    background:
      radial-gradient(285px 134px at 9% -20%, color-mix(in srgb, var(--status) 31%, transparent), transparent 64%),
      radial-gradient(235px 116px at 96% 118%, color-mix(in srgb, var(--status) 18%, transparent), transparent 71%),
      linear-gradient(155deg, color-mix(in srgb, var(--status) 8%, var(--surface-solid)), color-mix(in srgb, var(--surface-solid) 84%, transparent));
    padding:12px calc(18px + var(--tab-x)) 11px 22px;
    cursor:pointer; position:relative; overflow:visible; isolation:isolate;
    transition:transform .25s var(--ease), background .25s ease, border-color .25s ease, opacity .25s ease, filter .25s ease, box-shadow .25s ease;
    animation:rise .55s var(--ease) both; animation-delay:var(--delay,0ms);
    box-shadow:
      inset 0 0 0 1px color-mix(in srgb, rgba(255,255,255,.07) 55%, transparent),
      inset 0 0 26px color-mix(in srgb, var(--status) 8%, transparent),
      0 0 0 1px color-mix(in srgb, var(--status) 18%, transparent);
    filter:
      drop-shadow( 1.25px  0      0 color-mix(in srgb,var(--status) 72%,var(--line-strong)))
      drop-shadow(-1.25px  0      0 color-mix(in srgb,var(--status) 72%,var(--line-strong)))
      drop-shadow( 0       1.25px 0 color-mix(in srgb,var(--status) 72%,var(--line-strong)))
      drop-shadow( 0      -1.25px 0 color-mix(in srgb,var(--status) 72%,var(--line-strong)))
      drop-shadow( .9px    .9px   0 color-mix(in srgb,var(--status) 62%,var(--line-strong)))
      drop-shadow(-.9px    .9px   0 color-mix(in srgb,var(--status) 62%,var(--line-strong)))
      drop-shadow( .9px   -.9px   0 color-mix(in srgb,var(--status) 62%,var(--line-strong)))
      drop-shadow(-.9px   -.9px   0 color-mix(in srgb,var(--status) 62%,var(--line-strong)))
      drop-shadow(0 8px 18px color-mix(in srgb,var(--status) 10%,transparent));
  }

  /* Leave a tiny visible gap while preserving the interlocking rhythm. */
  .stage-card + .stage-card { margin-left:calc(-1 * var(--tab-x) + var(--piece-gap)); }

  /* First piece: flat/rounded outer left edge, only a right tab. */
  .stage-card:first-child {
    --left-socket:
      linear-gradient(#000 0 0)
      0 0 / calc(100% - var(--tab-x)) 100% no-repeat;
    border-radius:18px 0 0 18px;
    padding-left:20px;
  }

  /* Last piece: left socket, flat/rounded outer right edge, no tab reserve. */
  .stage-card:last-child {
    width:var(--piece-w);
    -webkit-mask:radial-gradient(ellipse var(--tab-x) var(--tab-y) at 0 50%, #0000 calc(100% - 1px), #000 100%);
            mask:radial-gradient(ellipse var(--tab-x) var(--tab-y) at 0 50%, #0000 calc(100% - 1px), #000 100%);
    border-radius:0 18px 18px 0;
    padding-right:20px;
  }

  .stage-card:only-child {
    width:var(--piece-w);
    -webkit-mask:linear-gradient(#000 0 0);
            mask:linear-gradient(#000 0 0);
    border-radius:18px;
    padding-inline:20px;
  }

  .stage-card:hover {
    z-index:30 !important;
    transform:translateY(-3px);
    /* contour strength is handled in filter so it also follows the tabs/sockets */
    background:
      radial-gradient(300px 140px at 9% -20%, color-mix(in srgb, var(--status) 40%, transparent), transparent 64%),
      radial-gradient(245px 120px at 96% 118%, color-mix(in srgb, var(--status) 24%, transparent), transparent 71%),
      linear-gradient(155deg, color-mix(in srgb, var(--status) 11%, var(--surface-solid)), color-mix(in srgb, var(--surface-solid) 86%, transparent));
    filter:
      drop-shadow( 1.45px  0      0 color-mix(in srgb,var(--status) 88%,var(--line-strong)))
      drop-shadow(-1.45px  0      0 color-mix(in srgb,var(--status) 88%,var(--line-strong)))
      drop-shadow( 0       1.45px 0 color-mix(in srgb,var(--status) 88%,var(--line-strong)))
      drop-shadow( 0      -1.45px 0 color-mix(in srgb,var(--status) 88%,var(--line-strong)))
      drop-shadow( 1px     1px    0 color-mix(in srgb,var(--status) 78%,var(--line-strong)))
      drop-shadow(-1px     1px    0 color-mix(in srgb,var(--status) 78%,var(--line-strong)))
      drop-shadow( 1px    -1px    0 color-mix(in srgb,var(--status) 78%,var(--line-strong)))
      drop-shadow(-1px    -1px    0 color-mix(in srgb,var(--status) 78%,var(--line-strong)))
      drop-shadow(0 12px 24px color-mix(in srgb,var(--status) 16%,transparent))
      drop-shadow(0 0 24px color-mix(in srgb,var(--status) 12%,transparent));
    box-shadow:
      inset 0 0 0 1px color-mix(in srgb, var(--status) 26%, rgba(255,255,255,.12)),
      inset 0 0 30px color-mix(in srgb, var(--status) 10%, transparent),
      0 0 0 1.25px color-mix(in srgb, var(--status) 28%, transparent);
  }

  .stage-card.selected {
    z-index:40 !important;
    transform:translateY(-4px);
    /* selected contour is also mask-aware */
    background:
      radial-gradient(325px 148px at 9% -20%, color-mix(in srgb, var(--status) 48%, transparent), transparent 64%),
      radial-gradient(260px 124px at 96% 118%, color-mix(in srgb, var(--status) 29%, transparent), transparent 71%),
      linear-gradient(155deg, color-mix(in srgb, var(--status) 14%, var(--surface-solid)), color-mix(in srgb, var(--surface-solid) 88%, transparent));
    filter:
      drop-shadow( 1.65px  0      0 color-mix(in srgb,var(--status) 96%,var(--line-strong)))
      drop-shadow(-1.65px  0      0 color-mix(in srgb,var(--status) 96%,var(--line-strong)))
      drop-shadow( 0       1.65px 0 color-mix(in srgb,var(--status) 96%,var(--line-strong)))
      drop-shadow( 0      -1.65px 0 color-mix(in srgb,var(--status) 96%,var(--line-strong)))
      drop-shadow( 1.1px   1.1px  0 color-mix(in srgb,var(--status) 88%,var(--line-strong)))
      drop-shadow(-1.1px   1.1px  0 color-mix(in srgb,var(--status) 88%,var(--line-strong)))
      drop-shadow( 1.1px  -1.1px  0 color-mix(in srgb,var(--status) 88%,var(--line-strong)))
      drop-shadow(-1.1px  -1.1px  0 color-mix(in srgb,var(--status) 88%,var(--line-strong)))
      drop-shadow(0 14px 28px color-mix(in srgb,var(--status) 20%,transparent))
      drop-shadow(0 0 31px color-mix(in srgb,var(--status) 16%,transparent));
    box-shadow:
      inset 0 0 0 1px color-mix(in srgb, var(--status) 38%, rgba(255,255,255,.16)),
      inset 0 0 36px color-mix(in srgb, var(--status) 13%, transparent),
      0 0 0 1.5px color-mix(in srgb, var(--status) 34%, transparent);
  }

  .stage-card.filtered { opacity:.20; filter:saturate(.2); transform:scale(.985); }

  @supports not ((mask: linear-gradient(#000 0 0)) or (-webkit-mask: linear-gradient(#000 0 0))) {
    .stage-card,
    .stage-card:first-child,
    .stage-card:last-child,
    .stage-card:only-child {
      width:var(--piece-w);
      margin-left:0;
      -webkit-mask:none;
      mask:none;
      border-radius:14px;
      padding-inline:18px;
    }
    .journey { gap:6px; }
  }

  .stage-name {
    margin:0; height:38px; max-width:164px; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden;
    font-size:13px; line-height:1.25; font-weight:650; letter-spacing:-.014em;
  }
  .criteria-preview { margin-top:10px; }
  .criteria-dots { display:flex; align-items:center; gap:5px; width:100%; max-width:138px; }
  .criteria-dot { flex:1 1 0; min-width:17px; height:5px; border-radius:999px; background:var(--surface-3); position:relative; overflow:hidden; }
  .criteria-dot.done { background:var(--green); box-shadow:0 0 10px color-mix(in srgb,var(--green) 22%,transparent); }
  .criteria-dot.partial { background:linear-gradient(90deg,var(--amber) 52%,var(--surface-3) 52%); box-shadow:0 0 8px color-mix(in srgb,var(--amber) 12%,transparent); }

    var main=el("div","summary-main"); var concl=el("article","conclusion-card"); concl.appendChild(el("div","summary-overline","Итог")); concl.appendChild(el("div","conclusion-text",summary.conclusion || "Итог пока не сформирован.")); main.appendChild(concl); sec.appendChild(main);
    var stack=el("div","summary-stack"); stack.appendChild(listCard("Ключевые риски",Array.isArray(summary.risks)?summary.risks:[],"risk")); stack.appendChild(listCard("Следующий лучший шаг",Array.isArray(summary.priorities)?summary.priorities:[],"priority")); sec.appendChild(stack);
  }

  function openSpotlight(i) {
    if(i<0 || i>=items.length) return; selected=i; renderSpotlight();
    document.getElementById("spotlight").classList.add("open"); document.getElementById("spotlight-backdrop").classList.add("open"); document.body.style.overflow="hidden";
    document.querySelectorAll(".stage-card").forEach(function(c){ c.classList.toggle("selected", Number(c.dataset.index)===i); });
  }

  function closeSpotlight() {
    document.getElementById("spotlight").classList.remove("open"); document.getElementById("spotlight-backdrop").classList.remove("open"); document.body.style.overflow="";
    document.querySelectorAll(".stage-card.selected").forEach(function(c){ c.classList.remove("selected"); }); selected=null;
  }

  function renderSpotlight() {
    var s=document.getElementById("spotlight"); s.innerHTML=""; if(selected===null) return; var item=items[selected], color=safeColor(item), p=itemPct(item); s.style.setProperty("--status",STATUS[color].color);
    var inner=el("div","spotlight-inner"); var top=el("div","spotlight-top"); top.appendChild(el("div","spotlight-step","Этап " + String(selected+1).padStart(2,"0") + " / " + String(items.length).padStart(2,"0"))); var close=el("button","close-btn","×"); close.type="button"; close.setAttribute("aria-label","Закрыть"); close.addEventListener("click",closeSpotlight); top.appendChild(close); inner.appendChild(top);
    var status=el("div","spotlight-status"); status.appendChild(el("i")); status.appendChild(el("span",null,item.label || STATUS[color].fallback)); inner.appendChild(status); inner.appendChild(el("h2","spotlight-title",item.title || "Без названия"));
    var meter=el("div","spotlight-meter"); var ring=el("div","small-ring"); ring.style.setProperty("--p",String(p)); ring.appendChild(el("strong",null,p+"%")); meter.appendChild(ring); var mc=el("div","meter-copy"); mc.appendChild(el("b",null,"Текущая готовность этапа")); mc.appendChild(el("span",null,item.description || item.title || "Описание этапа отсутствует.")); meter.appendChild(mc); inner.appendChild(meter);
    var es=el("section","spot-section"); es.appendChild(el("div","spot-label","Оценка модели"));
    var al=el("div","assessment-list"); var criteria=getAssessment(item); if(!criteria.length){ al.appendChild(el("div","spot-copy","Для этого этапа оценка модели пока не сформирована.")); }
    criteria.slice(0,5).forEach(function(x,criterionIndex){
      var st=assessmentStatus(x), itemWrap=el("div","assessment-item"); itemWrap.style.setProperty("--bullet",st.color);
      var textValue=typeof x==="string"?x:(x.text||x.title||"Без описания");
      var comment=typeof x==="object" && x ? (x.comment||x.note||x.details||"") : "";
      var row=el(comment?"button":"div","assessment-row");
      if(comment){
        row.type="button"; row.setAttribute("aria-expanded","false");
        var panelId="assessment-comment-"+selected+"-"+criterionIndex; row.setAttribute("aria-controls",panelId);
      }
      row.appendChild(el("span","assessment-state",st.icon)); row.appendChild(el("div","assessment-row-text",textValue));
      itemWrap.appendChild(row);
      if(comment){
        var wrap=el("div","assessment-comment-wrap"); wrap.id="assessment-comment-"+selected+"-"+criterionIndex;
        var clip=el("div","assessment-comment-clip"); clip.appendChild(el("div","assessment-comment",comment)); wrap.appendChild(clip); itemWrap.appendChild(wrap);
        row.addEventListener("click",function(){ var isOpen=itemWrap.classList.toggle("open"); row.setAttribute("aria-expanded",isOpen?"true":"false"); });
      }
      al.appendChild(itemWrap);
    }); es.appendChild(al); inner.appendChild(es);
    var nav=el("div","spot-nav"); var prev=el("button",null,"← Предыдущий"); var next=el("button",null,"Следующий →"); prev.type=next.type="button"; prev.disabled=selected===0; next.disabled=selected===items.length-1; prev.addEventListener("click",function(){openSpotlight(selected-1);}); next.addEventListener("click",function(){openSpotlight(selected+1);}); nav.appendChild(prev); nav.appendChild(next); inner.appendChild(nav); s.appendChild(inner);
  }

  function renderFooter() {
    var f=document.getElementById("footer"); var left=el("span"); left.appendChild(el("span","footer-dot")); left.appendChild(document.createTextNode("Readiness dashboard · интерактивный отчёт")); f.appendChild(left); f.appendChild(el("span",null, meta.generated_at ? "Обновлено " + formatMetaDate(meta.generated_at) : "Self-contained HTML"));
  }

  function setTheme(theme) {
    document.documentElement.setAttribute("data-theme",theme); try{localStorage.setItem("readiness-theme",theme);}catch(_){ }
    renderThemeIcon();
  }
  function renderThemeIcon() {
    var btn=document.getElementById("theme-toggle"); btn.innerHTML=""; var dark=document.documentElement.getAttribute("data-theme") === "dark";
    btn.appendChild(svgIcon(dark ? ["M12 3v2","M12 19v2","M3 12h2","M19 12h2","m5.64 5.64 1.42-1.42","m16.94 16.94 1.42-1.42","m5.64 18.36 1.42-1.42","m16.94 7.06 1.42-1.42","M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"] : ["M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"]));
  }
  try { var saved=localStorage.getItem("readiness-theme"); if(saved==="light"||saved==="dark") document.documentElement.setAttribute("data-theme",saved); } catch(_){ }
  document.getElementById("theme-toggle").addEventListener("click",function(){setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");}); renderThemeIcon();
  document.getElementById("spotlight-backdrop").addEventListener("click",closeSpotlight);
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeSpotlight(); if(selected!==null && e.key==="ArrowRight" && selected<items.length-1) openSpotlight(selected+1); if(selected!==null && e.key==="ArrowLeft" && selected>0) openSpotlight(selected-1); });
  document.addEventListener("pointermove",function(e){ document.documentElement.style.setProperty("--mx",(e.clientX/window.innerWidth*100).toFixed(1)+"%"); document.documentElement.style.setProperty("--my",(e.clientY/window.innerHeight*100).toFixed(1)+"%"); },{passive:true});

  renderHero();
  renderJourney();
  renderSummary();
  renderFooter();
})();
</script>
</body>
</html>
