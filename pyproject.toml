[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pko"
version = "0.1.0"
description = "PKO progress — сравнение PPTX-плана команды с кодом репозитория"
requires-python = ">=3.11"
dependencies = ["python-pptx>=1.0"]

[project.scripts]
pko = "pko.cli:main"

[tool.pytest.ini_options]
# Тесты написаны на unittest и запускаются как `make test`; эта секция нужна,
# чтобы их подхватывал и pytest, если сборочный контур использует его.
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.setuptools.packages.find]
where = ["src"]
