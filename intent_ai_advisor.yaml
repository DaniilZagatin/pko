# business_intent.yaml для проекта «ИИ-советник по клиентским путям и процессам»
# (poc-ai-agent-redesainer-vibe 0.0.2, коммит e43d2351a59)
#
# Ручной вход PKO. Значения восстановлены по коду и по ТЗ v1, но, согласно §4.0
# стандарта, подтвердить их обязан владелец клиентского результата — из кода они
# не выводятся.
#
# ВНИМАНИЕ 1: business_owner заполнен заглушкой, чтобы прогнать конвейер целиком.
# С реальным владельцем строку нужно заменить.
# ВНИМАНИЕ 2: значения записаны одной строкой в кавычках. Свёрнутые блоки YAML
# (`>-`, `|`) парсер PKO не поддерживает и отвергает весь файл.

# --- потребность -----------------------------------------------------------
confirmed_need_id: NEED-DPSS-REDESIGN-001
need_name: "Проведение редизайна клиентского пути или процесса по методологии ДПСС"
business_meaning: "Аналитик ДПСС ведёт проект редизайна КП или процесса. Данные о процессе размазаны по девяти системам мониторинга, а качество результата зависит от строгого соблюдения методологии. Нужен советник, который собирает данные по коду процесса и ведёт аналитика по десяти шагам, выдавая на каждом шаге артефакт установленного формата."
client: "Аналитик редизайна ДПСС, методолог, спонсор редизайна"

# --- ответственность -------------------------------------------------------
# Владелец объекта, отвечающий за клиентский результат. CODEOWNERS и техвладельцы
# сюда не подставляются (§4.1.3).
business_owner: "ЗАГЛУШКА ДЛЯ ПРОГОНА PKO — владелец продукта не назначен"

# --- клиентский путь -------------------------------------------------------
journey_purpose: "Довести аналитика от выбора процесса до Executive Summary по редизайну"
initial_state: "Процесс выбран для улучшения, но данные о нём не собраны, проблема не сформулирована, методология применяется вручную и непоследовательно."
target_state: "Сформирована полная цепочка артефактов шагов 1-9: контекст, Problem Statement с критериями успеха, границы, дерево гипотез, план исследований, синтез диагностики, дерево решений, карточки инициатив и Executive Summary для спонсора."
success_criteria: "Артефакты всех шагов сохранены и версионированы; отчёт шага 0 явно называет системы-источники, по которым данных не нашлось; Executive Summary опирается на выводы шагов 1, 2, 6, 7 и 8 и не противоречит им."

# --- входы профилирования (§0.2.1) ----------------------------------------
requested_mode: ASSIST          # советник: решение по инициативам принимает человек
maturity: pilot                 # версия 0.0.2, демо-аутентификация, каталог archive/
consequence: medium             # выводы влияют на управленческие решения по процессам
scale: local                    # пилот на командах ДПСС
external_effects: none          # только чтение витрины; записи в системы-источники нет
decision_boundary: END_TO_END_PROCESS

# --- граница решения -------------------------------------------------------
in_scope: "Диалоговое сопровождение методологии редизайна, чтение справочных данных из девяти систем через витрину PostgreSQL, генерация и версионирование артефактов, чат с методологом, свободный режим, распознавание документов."
out_of_scope: "Запись в системы-источники, принятие управленческих решений, автоматическое исполнение инициатив, наполнение витрины справочных данных."
forbidden_effects: "Запись в системы-источники, принятие управленческих решений, автоматическое исполнение инициатив, внешние финансовые и юридические действия."
